<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Le procédé de fabrication de la bière — CS Métiers du Bar</title>
<style>
:root{
  --noir:#14110F;
  --or:#C9A227;
  --or-clair:#E3C766;
  --blanc:#FFFFFF;
  --rouge-err:#8B2E2E;
  --vert-ok:#3E6B4F;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:var(--noir);
  color:var(--blanc);
  height:100vh;height:100dvh;
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
body::before{
  content:"";
  position:fixed;inset:0;
  background:
    radial-gradient(circle at 12% 8%, rgba(201,162,39,0.10), transparent 40%),
    radial-gradient(circle at 88% 92%, rgba(201,162,39,0.08), transparent 45%),
    repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 4px);
  pointer-events:none;
  z-index:0;
}

.stage{
  position:relative;z-index:1;
  width:min(94vw,980px);
  height:min(94dvh,640px);
  border:1px solid rgba(201,162,39,0.35);
  border-radius:clamp(10px,1.6vw,18px);
  background:linear-gradient(180deg, rgba(201,162,39,0.05), transparent 40%);
  display:flex;flex-direction:column;
  overflow:hidden;
  padding:clamp(12px,2vw,26px);
}

/* HEADER */
header{
  text-align:center;
  flex:0 0 auto;
  padding-bottom:clamp(6px,1.2vh,14px);
  border-bottom:1px solid rgba(201,162,39,0.25);
  margin-bottom:clamp(8px,1.4vh,16px);
}
.kicker{
  display:inline-block;
  letter-spacing:3px;
  font-size:clamp(9px,1.1vw,11px);
  text-transform:uppercase;
  color:var(--or-clair);
  border:1px solid rgba(201,162,39,0.45);
  border-radius:999px;
  padding:4px 14px;
  margin-bottom:clamp(4px,1vh,8px);
}

/* LOGO BADGE (medaillon blanc + bordure or, requis pour lisibilité sur fond noir) */
.logo-badge{
  width:clamp(40px,5.5vw,54px);
  height:clamp(40px,5.5vw,54px);
  border-radius:50%;
  background:var(--blanc);
  border:2px solid var(--or);
  margin:0 auto clamp(6px,1.2vh,10px);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  box-shadow:0 0 14px rgba(201,162,39,0.35);
}
.logo-badge img{width:82%;height:82%;object-fit:contain}

/* DECOR FLOTTANT (assets projet, discret, masqué sous 760px) */
.deco{
  position:fixed;
  z-index:0;
  opacity:0.1;
  pointer-events:none;
  user-select:none;
}
.deco-homme{bottom:2%;right:1.5%;width:clamp(140px,15vw,230px)}
.deco-shaker{top:6%;left:1.5%;width:clamp(90px,9vw,150px);transform:rotate(-6deg)}
@media (max-width:760px){ .deco{display:none} }
h1{
  font-size:clamp(16px,2.6vw,24px);
  letter-spacing:0.5px;
}
h1 span{color:var(--or)}

/* PROGRESSION HAUTE */
.progress-bar{
  margin-top:clamp(6px,1.2vh,12px);
  height:6px;
  background:rgba(255,255,255,0.08);
  border-radius:99px;
  overflow:hidden;
}
.progress-fill{
  height:100%;width:11.11%;
  background:linear-gradient(90deg, var(--or), var(--or-clair));
  border-radius:99px;
  transition:width .45s ease;
}

/* CORPS PRINCIPAL */
main{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:clamp(14px,3vw,40px);
  min-height:0;
}

.icon-wrap{
  flex:0 0 auto;
  width:clamp(90px,16vw,150px);
  height:clamp(90px,16vw,150px);
  border-radius:50%;
  border:2px solid var(--or);
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle, rgba(201,162,39,0.10), transparent 70%);
  box-shadow:0 0 22px rgba(201,162,39,0.25) inset, 0 0 18px rgba(201,162,39,0.2);
  position:relative;
}
.icon-wrap svg{width:58%;height:58%}
.step-num{
  position:absolute;
  top:-10px;left:-10px;
  width:clamp(26px,3.4vw,32px);
  height:clamp(26px,3.4vw,32px);
  border-radius:50%;
  background:var(--or);
  color:var(--noir);
  font-weight:bold;
  font-size:clamp(12px,1.6vw,15px);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(0,0,0,0.4);
}

.text-col{
  flex:1 1 auto;
  min-width:0;
  max-width:560px;
}
.step-title{
  font-size:clamp(17px,2.8vw,26px);
  color:var(--or);
  margin-bottom:clamp(6px,1.2vh,12px);
  letter-spacing:0.5px;
}
.step-desc{
  font-size:clamp(12.5px,1.6vw,15.5px);
  line-height:1.55;
  color:rgba(255,255,255,0.9);
}
.step-duree{
  display:none;
  align-items:center;
  gap:6px;
  margin-top:clamp(6px,1.2vh,10px);
  font-size:clamp(11px,1.4vw,13px);
  color:var(--or-clair);
  font-weight:bold;
}
.step-duree.show{display:flex}
.step-duree .clock{width:14px;height:14px;border:1.5px solid var(--or-clair);border-radius:50%;position:relative;flex:0 0 auto}
.step-duree .clock::after{content:"";position:absolute;top:1px;left:6px;width:1px;height:5px;background:var(--or-clair)}
.step-duree .clock::before{content:"";position:absolute;top:6px;left:6px;width:4px;height:1px;background:var(--or-clair)}
.step-tag{
  display:inline-block;
  margin-top:clamp(8px,1.6vh,14px);
  font-size:clamp(10px,1.2vw,11.5px);
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--or-clair);
  border-left:3px solid var(--or);
  padding-left:8px;
}

/* FRISE DES ETAPES (mini rail cliquable) */
.rail{
  flex:0 0 auto;
  display:flex;
  justify-content:flex-start;
  align-items:center;
  gap:clamp(4px,1vw,10px);
  margin:clamp(8px,1.6vh,16px) auto 0;
  flex-wrap:nowrap;
  overflow-x:auto;
  padding:4px 2px 8px;
  max-width:100%;
  width:fit-content;
}
.rail::-webkit-scrollbar{height:4px}
.rail::-webkit-scrollbar-thumb{background:rgba(201,162,39,0.4);border-radius:4px}
.rail-dot{
  flex:0 0 auto;
  min-width:44px;height:44px;
  border-radius:50%;
  border:1.5px solid rgba(201,162,39,0.4);
  background:rgba(255,255,255,0.02);
  color:rgba(255,255,255,0.65);
  font-size:clamp(11px,1.4vw,13px);
  font-weight:bold;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition:all .25s;
}
.rail-dot:hover{border-color:var(--or)}
.rail-dot.active{
  background:var(--or);
  color:var(--noir);
  border-color:var(--or);
  box-shadow:0 0 14px rgba(201,162,39,0.5);
}
.rail-dot.done{border-color:var(--vert-ok);color:var(--vert-ok)}

/* CONTROLES */
.controls{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-top:clamp(8px,1.4vh,14px);
}
.nav-btn{
  min-width:44px;min-height:44px;
  border-radius:50%;
  border:1px solid var(--or);
  background:transparent;
  color:var(--or);
  font-size:20px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .25s;
}
.nav-btn:hover{background:var(--or);color:var(--noir)}
.nav-btn:disabled{opacity:0.3;cursor:default;background:transparent;color:var(--or)}
.step-count{
  font-size:clamp(11px,1.4vw,13px);
  color:rgba(255,255,255,0.65);
  letter-spacing:1px;
}

footer{
  flex:0 0 auto;
  text-align:center;
  font-size:clamp(9px,1vw,10.5px);
  letter-spacing:1px;
  color:rgba(255,255,255,0.35);
  text-transform:uppercase;
  margin-top:clamp(4px,1vh,8px);
}

@media (max-width:640px){
  main{flex-direction:column;gap:clamp(8px,2vh,16px);text-align:center}
  .text-col{max-width:100%}
  .step-tag{border-left:none;border-top:2px solid var(--or);padding-left:0;padding-top:6px}
}
</style>
</head>

    clarification: `<circle cx="32" cy="32" r="20"/><path d="M32 32 m-12 0 a12 12 0 1 1 24 0 a12 12 0 1 1 -24 0" opacity="0.5"/><path d="M32 20 Q40 26 32 32 Q24 38 32 44"/>`,
    refroidissement: `<path d="M32 10 L32 54 M14 20 L50 44 M50 20 L14 44"/><circle cx="32" cy="32" r="4" fill="#C9A227"/>`,
    fermentation: `<path d="M20 16 L44 16 L44 46 Q32 54 20 46 Z"/><path d="M20 16 Q32 22 44 16"/><circle cx="27" cy="30" r="1.6" fill="#C9A227"/><circle cx="35" cy="36" r="1.6" fill="#C9A227"/><circle cx="30" cy="42" r="1.6" fill="#C9A227"/><circle cx="24" cy="24" r="1.6" fill="#C9A227"/>`,
    garde: `<path d="M18 20 Q18 14 32 14 Q46 14 46 20 L46 44 Q46 50 32 50 Q18 50 18 44 Z"/><path d="M18 26 L46 26 M18 38 L46 38"/><path d="M24 14 L24 50 M40 14 L40 50" opacity="0.5"/>`,
    ensemencement: `<path d="M20 30 L44 30 L44 50 Q32 56 20 50 Z"/><path d="M20 30 Q32 36 44 30"/><circle cx="27" cy="16" r="1.8" fill="#C9A227"/><circle cx="34" cy="12" r="1.8" fill="#C9A227"/><circle cx="38" cy="18" r="1.8" fill="#C9A227"/><circle cx="30" cy="20" r="1.8" fill="#C9A227"/><path d="M27 16 L29 26 M34 12 L33 26 M38 18 L36 27"/>`,
    conditionnement: `<path d="M20 14 L30 14 L30 22 L34 28 L34 52 Q34 56 25 56 Q16 56 16 52 L16 28 L20 22 Z"/><path d="M38 20 L52 20 M45 20 L45 52 M38 30 L38 52 M52 30 L52 52 M38 30 L52 30" opacity="0.85"/>`,
    refermentation: `<rect x="14" y="16" width="36" height="34" rx="3"/><path d="M14 26 L50 26 M14 36 L50 36 M22 16 L22 50 M32 16 L32 50 M42 16 L42 50" opacity="0.55"/><path d="M32 6 L32 12" /><circle cx="32" cy="4" r="2" fill="#C9A227"/>`
  };

  const STEPS = [
    { key:'concassage', titre:'Le concassage', desc:"Faciliter l'extraction des sucres." },
    { key:'empatage', titre:"L'empâtage et le brassage", desc:"La farine obtenue grâce au concassage est mélangée avec de l'eau à 45 °C. On passe au brassage, en augmentant la température pour que les enzymes entrent en action." },
    { key:'filtration', titre:'La filtration', desc:"On sépare le moût (jus sucré) des drêches (enveloppes des céréales) pour obtenir un moût plus limpide." },
    { key:'ebullition', titre:"L'ébullition et le houblonnage", desc:"Après filtration, on transfère le moût dans une cuve d'ébullition (environ 1 h pour le stériliser). C'est pendant cette phase qu'on ajoute le ou les houblons." },
    { key:'clarification', titre:'La clarification', desc:"La clarification se fait dans une cuve appelée Whirlpool. Elle permet d'éliminer les matières et particules en suspension pour obtenir un moût clair." },
    { key:'refroidissement', titre:'Le refroidissement', desc:"On obtient un moût à une température acceptable pour l'ensemencement des levures." },
    { key:'fermentation', titre:'La fermentation', desc:"Une fois la température atteinte grâce au refroidissement, on transfère le moût dans une cuve de fermentation. Il est ensemencé avec les levures sélectionnées. La fermentation commence alors rapidement." },
    { key:'garde', titre:'La garde', desc:"Après environ une semaine de fermentation, la bière entame sa période de garde, qui lui donne un profil aromatique harmonieux." },
    { key:'conditionnement', titre:'Le conditionnement et la refermentation', desc:"La bière est alors presque prête : c'est le stade dit de « bière verte ». Le CO2 produit lors de la fermentation a été évacué de la cuve. Deux solutions existent pour la rendre plus gazeuse : injecter du gaz carbonique lors du conditionnement, ou faire refermenter la bière en bouteille ou en fût." }
  ];
  const TOTAL = STEPS.length;

  let idx = 0;
  const seen = new Set([0]);

  const stepIcon = document.getElementById('stepIcon');
  const stepNum = document.getElementById('stepNum');
  const stepTitle = document.getElementById('stepTitle');
  const stepDesc = document.getElementById('stepDesc');
  const stepDuree = document.getElementById('stepDuree');
  const stepDureeText = document.getElementById('stepDureeText');
  const stepTag = document.getElementById('stepTag');
  const stepCount = document.getElementById('stepCount');
  const progressFill = document.getElementById('progressFill');
  const rail = document.getElementById('rail');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  STEPS.forEach((s,i)=>{
    const d = document.createElement('div');
    d.className = 'rail-dot' + (i===0?' active':'');
    d.textContent = i+1;
    d.addEventListener('click', ()=> render(i));
    rail.appendChild(d);
  });
  const dots = rail.children;

  function render(i){
    idx = i;
    seen.add(i);
    const s = STEPS[i];
    stepIcon.innerHTML = ICONS[s.key];
    stepNum.textContent = i+1;
    stepTitle.textContent = s.titre;
    stepDesc.textContent = s.desc;
    if(s.duree){
      stepDuree.classList.add('show');
      stepDureeText.textContent = s.duree;
    } else {
      stepDuree.classList.remove('show');
    }
    stepTag.textContent = 'Étape ' + (i+1) + ' / ' + TOTAL;
    stepCount.textContent = 'Étape ' + (i+1) + ' sur ' + TOTAL;
    progressFill.style.width = ((i+1)/TOTAL*100) + '%';
    for(let j=0;j<dots.length;j++){
      dots[j].classList.toggle('active', j===i);
      dots[j].classList.toggle('done', seen.has(j) && j!==i);
    }
    dots[i].scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
    prevBtn.disabled = (i===0);
    nextBtn.disabled = (i===TOTAL-1);
  }

  prevBtn.addEventListener('click', ()=>{ if(idx>0) render(idx-1); });
  nextBtn.addEventListener('click', ()=>{ if(idx<TOTAL-1) render(idx+1); });
  document.addEventListener('keydown', e=>{
    if(e.key==='ArrowLeft' && idx>0) render(idx-1);
    if(e.key==='ArrowRight' && idx<TOTAL-1) render(idx+1);
  });

  render(0);
})();
</script>
