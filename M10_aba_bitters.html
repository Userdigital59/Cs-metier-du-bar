<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Les Bitters — CS Métiers du Bar</title>
<style>
:root{
  --noir:#14110F;
  --or:#C9A227;
  --or-clair:#E3C766;
  --blanc:#FFFFFF;
  --rouge-err:#8B2E2E;
  --vert-ok:#3E6B4F;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%; overflow:hidden;}
body{
  height:100vh; height:100dvh;
  background:var(--noir);
  color:var(--blanc);
  font-family:Arial, Helvetica, sans-serif;
  display:flex; align-items:center; justify-content:center;
  position:relative;
}
body::before{
  content:"";
  position:fixed; inset:0;
  background:
    radial-gradient(circle at 15% 10%, rgba(201,162,39,0.10), transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(201,162,39,0.08), transparent 45%),
    repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 4px);
  pointer-events:none;
  z-index:0;
}
.stage{
  position:relative; z-index:1;
  width:min(96vw, 1080px);
  height:min(94dvh, 700px);
  border:1px solid rgba(201,162,39,0.35);
  border-radius:clamp(10px,1.2vw,16px);
  display:flex; flex-direction:column;
  overflow:hidden;
  background:linear-gradient(180deg, rgba(201,162,39,0.04), transparent 20%);
}
header{
  padding:clamp(8px,1.6vh,16px) clamp(14px,3vw,32px) clamp(4px,0.8vh,8px);
  text-align:center;
  border-bottom:1px solid rgba(201,162,39,0.25);
  flex-shrink:0;
  display:flex; flex-direction:column; align-items:center;
  gap:2px;
}
.logo{
  width:clamp(38px,4.5vw,56px);
  height:clamp(38px,4.5vw,56px);
  border-radius:50%;
  margin-bottom:2px;
}
.kicker{
  font-size:clamp(9px,1vw,12px);
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--or-clair);
}
h1{
  font-size:clamp(18px,2.6vw,28px);
  font-weight:700;
}
h1 span{color:var(--or);}
.subtitle{
  font-size:clamp(10px,1.1vw,13px);
  color:rgba(255,255,255,0.65);
}
.grid{
  flex:1;
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  grid-template-rows:repeat(2, 1fr);
  gap:clamp(8px,1.4vw,16px);
  padding:clamp(10px,1.6vh,18px) clamp(14px,3vw,32px);
  min-height:0;
}
.card{
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(201,162,39,0.3);
  border-radius:clamp(8px,1vw,12px);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:clamp(1px,0.4vh,4px);
  cursor:pointer;
  transition:transform .15s ease, border-color .15s ease, background .15s ease;
  padding:clamp(6px,0.8vh,10px) clamp(4px,0.8vw,8px);
  text-align:center;
  min-height:0;
  overflow:hidden;
}
.card:hover, .card:focus-visible{
  transform:translateY(-3px);
  border-color:var(--or);
  background:rgba(201,162,39,0.08);
}
.card img{
  height:clamp(60px,11vh,110px);
  width:auto;
  max-width:70%;
  object-fit:contain;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,0.5));
  cursor:zoom-in;
}
.card .no-img{
  height:clamp(60px,11vh,110px);
  width:clamp(40px,6vw,60px);
  display:flex; align-items:center; justify-content:center;
  font-size:clamp(9px,1vw,11px);
  color:rgba(255,255,255,0.35);
  border:1px dashed rgba(201,162,39,0.3);
  border-radius:6px;
}
.card .pays{
  font-size:clamp(7px,0.75vw,9px);
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--or-clair);
}
.card .nom{
  font-size:clamp(12px,1.4vw,16px);
  font-weight:700;
  color:var(--blanc);
}
.card .deg{
  font-size:clamp(12px,1.5vw,16px);
  font-weight:700;
  color:var(--or);
}
footer{
  padding:clamp(5px,1vh,8px) clamp(14px,3vw,32px);
  text-align:center;
  font-size:clamp(9px,1vw,11px);
  color:rgba(255,255,255,0.5);
  border-top:1px solid rgba(201,162,39,0.2);
  flex-shrink:0;
}
footer .public{color:var(--or-clair); font-weight:700;}

/* Overlay détail */
.overlay{
  position:fixed; inset:0;
  background:rgba(0,0,0,0.72);
  display:none;
  align-items:center; justify-content:center;
  z-index:10;
  padding:clamp(10px,3vw,30px);
}
.overlay.active{display:flex;}
.panel{
  width:min(92vw, 760px);
  max-height:88dvh;
  background:var(--noir);
  border:1px solid var(--or);
  border-radius:clamp(10px,1.2vw,16px);
  display:flex; flex-direction:column;
  overflow:hidden;
  box-shadow:0 0 40px rgba(201,162,39,0.25);
}
.panel-head{
  padding:clamp(12px,1.8vh,18px) clamp(16px,3vw,28px);
  border-bottom:1px solid rgba(201,162,39,0.3);
  display:flex; align-items:center; gap:clamp(10px,2vw,18px);
}
.panel-head img{
  height:clamp(90px,16vh,170px);
  width:auto;
  object-fit:contain;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,0.5));
  flex-shrink:0;
  cursor:zoom-in;
  transition:transform .15s ease;
}
.panel-head img:hover{transform:scale(1.05);}
.panel-head .txt{flex:1; min-width:0;}
.zoom-hint{
  font-size:clamp(8px,0.9vw,10px);
  color:rgba(255,255,255,0.4);
  display:block;
  margin-top:2px;
}
.panel-head h2{
  font-size:clamp(16px,2.2vw,24px);
  color:var(--or);
}
.panel-head .sub{
  font-size:clamp(9px,1vw,11px);
  color:rgba(255,255,255,0.6);
  text-transform:uppercase;
  letter-spacing:0.08em;
}
.close-btn{
  background:transparent;
  border:1px solid var(--or);
  color:var(--or-clair);
  width:32px; height:32px;
  border-radius:50%;
  font-size:16px;
  cursor:pointer;
  flex-shrink:0;
}
.close-btn:hover{background:rgba(201,162,39,0.15);}
.panel-body{
  padding:clamp(12px,2vh,20px) clamp(16px,3vw,28px);
  overflow-y:auto;
  display:flex; flex-direction:column; gap:clamp(10px,1.4vh,14px);
}
.bloc-label{
  font-size:clamp(10px,1.1vw,12px);
  text-transform:uppercase;
  letter-spacing:0.1em;
  color:var(--or-clair);
  margin-bottom:4px;
  display:block;
}
.bloc-txt{
  font-size:clamp(13px,1.5vw,15px);
  line-height:1.5;
  color:rgba(255,255,255,0.9);
}

/* Lightbox zoom image */
.zoom-overlay{
  position:fixed; inset:0;
  background:rgba(0,0,0,0.88);
  display:none;
  align-items:center; justify-content:center;
  z-index:20;
  padding:clamp(16px,4vw,40px);
  cursor:zoom-out;
}
.zoom-overlay.active{display:flex;}
.zoom-overlay img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  border-radius:8px;
  box-shadow:0 0 60px rgba(201,162,39,0.3);
}
.zoom-close{
  position:absolute;
  top:clamp(12px,3vh,24px);
  right:clamp(12px,3vw,24px);
  background:rgba(20,17,15,0.8);
  border:1px solid var(--or);
  color:var(--or-clair);
  width:40px; height:40px;
  border-radius:50%;
  font-size:18px;
  cursor:pointer;
}
.zoom-close:hover{background:rgba(201,162,39,0.2);}
</style>
</head>

const grid = document.getElementById('grid');
const overlay = document.getElementById('overlay');
const closeBtn = document.getElementById('closeBtn');
const panelNom = document.getElementById('panelNom');
const panelPays = document.getElementById('panelPays');
const panelImg = document.getElementById('panelImg');
const panelHistoire = document.getElementById('panelHistoire');
const panelCarac = document.getElementById('panelCarac');

const zoomOverlay = document.getElementById('zoomOverlay');
const zoomImg = document.getElementById('zoomImg');
const zoomClose = document.getElementById('zoomClose');

function openZoom(src, alt, e){
  if(e) e.stopPropagation();
  if(!src) return;
  zoomImg.src = src;
  zoomImg.alt = alt;
  zoomOverlay.classList.add('active');
}
zoomClose.addEventListener('click', () => zoomOverlay.classList.remove('active'));
zoomOverlay.addEventListener('click', (e) => { if(e.target !== zoomImg) zoomOverlay.classList.remove('active'); });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') zoomOverlay.classList.remove('active'); });

bitters.forEach((b) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.tabIndex = 0;
  card.innerHTML = `
    ${b.img ? `<img src="${b.img}" alt="${b.nom}">` : `<div class="no-img">photo à venir</div>`}
    <span class="pays">${b.pays}</span>
    <span class="nom">${b.nom}</span>
    <span class="deg">${b.deg}</span>
  `;
  const cardImg = card.querySelector('img');
  if(cardImg){
    cardImg.addEventListener('click', (e) => openZoom(b.img, b.nom, e));
  }
  const open = () => {
    panelNom.textContent = b.nom + ' — ' + b.deg;
    panelPays.textContent = b.pays;
    panelImg.src = b.img;
    panelImg.style.display = b.img ? 'block' : 'none';
    panelImg.alt = b.nom;
    panelImg.onclick = (e) => openZoom(b.img, b.nom, e);
    panelHistoire.textContent = b.histoire;
    panelCarac.textContent = b.carac;
    overlay.classList.add('active');
  };
  card.addEventListener('click', open);
  card.addEventListener('keypress', (e) => { if(e.key === 'Enter') open(); });
  grid.appendChild(card);
});

closeBtn.addEventListener('click', () => overlay.classList.remove('active'));
overlay.addEventListener('click', (e) => { if(e.target === overlay) overlay.classList.remove('active'); });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') overlay.classList.remove('active'); });

function adjustGrid(){
  const w = window.innerWidth;
  if(w <= 640){
    grid.style.gridTemplateColumns = '1fr';
    grid.style.gridTemplateRows = 'repeat(6, 1fr)';
    grid.style.overflowY = 'auto';
  } else if(w <= 899){
    grid.style.gridTemplateColumns = 'repeat(2, 1fr)';
    grid.style.gridTemplateRows = 'repeat(3, 1fr)';
  } else {
    grid.style.gridTemplateColumns = 'repeat(3, 1fr)';
    grid.style.gridTemplateRows = 'repeat(2, 1fr)';
  }
}
window.addEventListener('resize', adjustGrid);
adjustGrid();
</script>
