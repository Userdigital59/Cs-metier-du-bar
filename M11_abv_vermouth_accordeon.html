<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le process du Vermouth</title>
<style>
:root{
  --noir:#14110F;
  --or:#C9A227;
  --or-clair:#E3C766;
  --blanc:#FFFFFF;
  --rouge-err:#8B2E2E;
  --vert-ok:#3E6B4F;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  height:100dvh;
  overflow:hidden;
  background:var(--noir);
  color:var(--blanc);
  font-family:Arial, sans-serif;
}
body{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:clamp(10px,2vw,24px);
}
body::before{
  content:"";
  position:fixed; inset:0;
  background:
    radial-gradient(circle at 15% 10%, rgba(201,162,39,0.10), transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(201,162,39,0.08), transparent 45%),
    repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 4px);
  pointer-events:none;
  z-index:0;
}
.stage{
  position:relative;
  z-index:1;
  width:100%;
  max-width:900px;
  max-height:100%;
  overflow-y:auto;
  border:1px solid rgba(201,162,39,0.35);
  border-radius:14px;
  background:rgba(20,17,15,0.6);
  padding:clamp(16px,3vw,32px);
}

/* Logo médaillon */
.logo-medaillon{
  position:absolute;
  top:clamp(10px,1.6vw,16px);
  left:clamp(10px,1.6vw,16px);
  width:clamp(40px,5vw,56px);
  height:clamp(40px,5vw,56px);
  border-radius:50%;
  background:var(--blanc);
  border:2px solid var(--or);
  box-shadow:0 0 10px rgba(201,162,39,0.35);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  z-index:3;
}
.logo-medaillon img{
  width:88%;
  height:88%;
  object-fit:contain;
}

/* Déco flottantes (shaker, personnage) — masquées sous 760px */
.deco{
  position:fixed;
  pointer-events:none;
  opacity:0.12;
  z-index:0;
}
.deco-shaker{
  bottom:2%;
  left:1.5%;
  width:clamp(90px,10vw,150px);
}
.deco-shaker img{width:100%;display:block;}

.deco-personnage{
  bottom:0;
  right:1%;
  width:clamp(160px,18vw,300px);
  opacity:0.16;
}
.deco-personnage img{width:100%;display:block;}

@media (max-width:760px){
  .deco{display:none;}
}
.stage::-webkit-scrollbar{width:6px;}
.stage::-webkit-scrollbar-thumb{background:var(--or);border-radius:4px;}

h1{
  font-size:clamp(1.2rem,2.5vw,1.7rem);
  color:var(--or);
  text-align:center;
  margin-bottom:clamp(4px,1vw,8px);
  margin-left:clamp(46px,6vw,64px);
  letter-spacing:0.5px;
}
.sous-titre{
  text-align:center;
  color:var(--or-clair);
  font-size:clamp(0.75rem,1.3vw,0.9rem);
  margin-bottom:clamp(14px,2.5vw,22px);
  font-style:italic;
}

.etape{
  border:1px solid rgba(201,162,39,0.3);
  border-radius:10px;
  margin-bottom:10px;
  overflow:hidden;
  background:rgba(255,255,255,0.02);
  transition:border-color .25s ease;
}
.etape.ouvert{
  border-color:var(--or);
}

.etape-header{
  display:flex;
  align-items:center;
  gap:clamp(10px,2vw,16px);
  width:100%;
  background:transparent;
  border:none;
  color:var(--blanc);
  padding:clamp(12px,2vw,16px);
  cursor:pointer;
  text-align:left;
  min-height:44px;
  font-family:Arial, sans-serif;
}
.etape-header:hover{
  background:rgba(201,162,39,0.06);
}

.num{
  flex:0 0 auto;
  width:clamp(30px,4vw,38px);
  height:clamp(30px,4vw,38px);
  border-radius:50%;
  background:var(--or);
  color:var(--noir);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:clamp(0.9rem,1.6vw,1.05rem);
}
.etape-titre{
  flex:1;
  font-weight:bold;
  font-size:clamp(0.9rem,1.7vw,1.1rem);
  letter-spacing:0.3px;
}
.chevron{
  flex:0 0 auto;
  width:22px;
  height:22px;
  color:var(--or);
  transition:transform .3s ease;
  display:flex;
  align-items:center;
  justify-content:center;
}
.etape.ouvert .chevron{
  transform:rotate(180deg);
}

.etape-contenu{
  max-height:0;
  overflow:hidden;
  transition:max-height .35s ease;
}
.etape-contenu-inner{
  padding:0 clamp(14px,3vw,22px) clamp(14px,2.5vw,20px) calc(clamp(30px,4vw,38px) + clamp(10px,2vw,16px) + clamp(14px,3vw,22px));
  font-size:clamp(0.82rem,1.5vw,0.95rem);
  line-height:1.55;
  color:rgba(255,255,255,0.9);
}
.etape-contenu-inner ul{
  list-style:none;
  padding:0;
}
.etape-contenu-inner li{
  position:relative;
  padding-left:18px;
  margin-bottom:6px;
}
.etape-contenu-inner li::before{
  content:"•";
  position:absolute;
  left:0;
  color:var(--or);
  font-weight:bold;
}
.exemple{
  margin-top:8px;
  padding:8px 12px;
  border-left:2px solid var(--or-clair);
  background:rgba(227,199,102,0.06);
  font-style:italic;
  font-size:clamp(0.78rem,1.4vw,0.88rem);
  color:var(--or-clair);
}

.fleche-liaison{
  text-align:center;
  color:var(--or);
  font-size:1.1rem;
  margin:-2px 0 8px 0;
  opacity:0.6;
}

.footer-note{
  margin-top:clamp(14px,2.5vw,20px);
  text-align:center;
  font-size:clamp(0.7rem,1.2vw,0.78rem);
  color:rgba(255,255,255,0.45);
}
</style>
</head>

  <h1>Le process du Vermouth</h1>
  <p class="sous-titre">Cliquez sur chaque étape pour dérouler le détail</p>

  <div id="accordeon"></div>

  <p class="footer-note">Contenu apprenant — CS Métiers du Bar</p>
</div>

<script>
const etapes = [
  {
    titre: "Vins ou mistelles (base ≥ 80 % du volume)",
    contenu: `
      <ul>
        <li>Peuvent être mutés ou recevoir un ajout de moût ou de mistelles</li>
        <li>Mistelle = moût de raisin frais muté à l'alcool avant fermentation</li>
        <li>Élaboration séparée selon le cépage</li>
        <li>Vieillissement en fûts</li>
        <li>Assemblage avant macération</li>
      </ul>
    `
  },
  {
    titre: "Macération",
    contenu: `
      <ul>
        <li>Ajout de plantes et épices</li>
      </ul>
      <div class="exemple">Ex. Noilly Prat : camomille d'Italie, coriandre de Bulgarie, écorce d'orange amère d'Espagne, noix de muscade d'Indonésie, centaurée du Maroc...</div>
    `
  },
  {
    titre: "Vieillissement en fûts",
    contenu: `<ul><li>Affinage du vin aromatisé avant filtrage</li></ul>`
  },
  {
    titre: "Filtrages",
    contenu: `<ul><li>Clarification du produit avant mise en bouteille</li></ul>`
  },
  {
    titre: "Mise en bouteille",
    contenu: `<ul><li>Étape finale, produit prêt à la commercialisation</li></ul>`
  }
];

const container = document.getElementById('accordeon');

etapes.forEach((e, i) => {
  const div = document.createElement('div');
  div.className = 'etape';
  div.innerHTML = `
    <button class="etape-header" aria-expanded="false">
      <span class="num">${i+1}</span>
      <span class="etape-titre">${e.titre}</span>
      <span class="chevron">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </span>
    </button>
    <div class="etape-contenu">
      <div class="etape-contenu-inner">${e.contenu}</div>
    </div>
  `;
  container.appendChild(div);

  if (i < etapes.length - 1) {
    const fleche = document.createElement('div');
    fleche.className = 'fleche-liaison';
    fleche.innerHTML = '↓';
    container.appendChild(fleche);
  }
});

document.querySelectorAll('.etape-header').forEach(btn => {
  btn.addEventListener('click', () => {
    const etape = btn.parentElement;
    const contenu = etape.querySelector('.etape-contenu');
    const estOuvert = etape.classList.contains('ouvert');

    document.querySelectorAll('.etape').forEach(e => {
      e.classList.remove('ouvert');
      e.querySelector('.etape-contenu').style.maxHeight = null;
      e.querySelector('.etape-header').setAttribute('aria-expanded','false');
    });

    if (!estOuvert) {
      etape.classList.add('ouvert');
      contenu.style.maxHeight = contenu.scrollHeight + 'px';
      btn.setAttribute('aria-expanded','true');
    }
  });
});
</script>
