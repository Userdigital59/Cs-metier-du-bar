<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Cognac vs Armagnac — Comparateur</title>
<style>
:root{
  --noir:#14110F;
  --or:#C9A227;
  --or-clair:#E3C766;
  --blanc:#FFFFFF;
  --rouge-err:#8B2E2E;
  --vert-ok:#3E6B4F;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{
  height:100dvh;
  overflow:hidden;
  background:var(--noir);
  font-family:Arial, Helvetica, sans-serif;
  color:var(--blanc);
}
body::before{
  content:"";
  position:fixed; inset:0;
  background:
    radial-gradient(circle at 15% 10%, rgba(201,162,39,0.10), transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(201,162,39,0.08), transparent 45%),
    repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 4px);
  pointer-events:none;
  z-index:0;
}
.deco{
  position:fixed;
  opacity:0.10;
  pointer-events:none;
  z-index:0;
}
.deco.shaker-left{ left:-40px; bottom:-20px; width:230px; transform:rotate(-8deg); }
@media (max-width:760px){ .deco{ display:none; } }

.wrap{
  position:relative;
  z-index:1;
  height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:clamp(10px,2vh,24px) clamp(10px,2vw,28px);
}
.stage{
  width:100%;
  max-width:1040px;
  height:100%;
  border:1px solid rgba(201,162,39,0.35);
  border-radius:clamp(10px,1.2vw,16px);
  background:rgba(255,255,255,0.02);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
header{
  flex:0 0 auto;
  padding:clamp(10px,1.6vh,16px) clamp(14px,2vw,26px) clamp(8px,1.2vh,10px);
  border-bottom:1px solid rgba(201,162,39,0.25);
  display:flex;
  align-items:center;
  gap:clamp(10px,1.6vw,16px);
}
.logo-medal{
  flex:0 0 auto;
  width:clamp(40px,5.5vw,58px);
  height:clamp(40px,5.5vw,58px);
  border-radius:50%;
  background:var(--blanc);
  border:2px solid var(--or);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  box-shadow:0 0 10px rgba(201,162,39,0.35);
}
.logo-medal img{ width:82%; height:82%; object-fit:contain; }
.htitle{ flex:1 1 auto; text-align:left; }
h1{
  font-size:clamp(1rem,2.4vw,1.55rem);
  color:var(--or-clair);
  letter-spacing:0.02em;
}
h1 span{color:var(--blanc); font-weight:400; font-size:0.68em; display:block; margin-top:2px;}

.duel-btn{
  flex:0 0 auto;
  font-family:inherit;
  font-weight:bold;
  font-size:clamp(0.72rem,1.5vw,0.9rem);
  padding:clamp(9px,1.4vh,12px) clamp(12px,1.8vw,18px);
  min-height:44px;
  border-radius:22px;
  border:none;
  background:var(--or);
  color:var(--noir);
  cursor:pointer;
  transition:all .15s ease;
  white-space:nowrap;
}
.duel-btn:hover{ transform:translateY(-2px); box-shadow:0 4px 14px rgba(201,162,39,0.45); }

.viewbar{
  flex:0 0 auto;
  display:flex;
  gap:8px;
  padding:clamp(8px,1.4vh,12px) clamp(14px,2vw,26px);
  border-bottom:1px solid rgba(201,162,39,0.18);
}
.viewbar button{
  flex:1;
  font-family:inherit;
  font-size:clamp(0.72rem,1.6vw,0.92rem);
  font-weight:bold;
  padding:10px 8px;
  min-height:44px;
  border-radius:8px;
  border:1px solid rgba(201,162,39,0.4);
  background:transparent;
  color:var(--blanc);
  cursor:pointer;
  transition:all .15s ease;
}
.viewbar button.active{
  background:var(--or);
  color:var(--noir);
  border-color:var(--or);
}
.viewbar button:hover{ transform:translateY(-1px); }

.body{
  flex:1 1 auto;
  overflow-y:auto;
  overflow-x:hidden;
  padding:clamp(10px,1.6vh,16px) clamp(14px,2vw,26px) clamp(14px,2vh,20px);
}
.row{
  border-radius:8px;
  overflow:hidden;
  margin-bottom:clamp(6px,1vh,10px);
  border:1px solid rgba(255,255,255,0.06);
}
.label{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  font-size:clamp(0.68rem,1.3vw,0.82rem);
  font-weight:bold;
  color:var(--or-clair);
  background:rgba(201,162,39,0.08);
  padding:clamp(8px,1.2vh,12px) clamp(8px,1vw,12px);
  border-left:3px solid var(--or);
  transition:background .15s ease;
  cursor:pointer;
  min-height:44px;
}
.row:hover .label{ background:rgba(201,162,39,0.18); }
.chevron{
  flex:0 0 auto;
  width:22px; height:22px;
  display:flex; align-items:center; justify-content:center;
  transition:transform .2s ease;
  color:var(--or);
  font-size:0.85rem;
}
.row.open .chevron{ transform:rotate(180deg); }

.cellwrap{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:clamp(6px,1vw,14px);
  max-height:0;
  overflow:hidden;
  transition:max-height .25s ease, padding .25s ease;
  padding:0 clamp(8px,1vw,12px);
}
.row.open .cellwrap{
  max-height:400px;
  padding:clamp(8px,1.2vh,10px) clamp(8px,1vw,12px) clamp(10px,1.4vh,14px);
}
.cell{
  font-size:clamp(0.68rem,1.35vw,0.85rem);
  line-height:1.4;
  padding:clamp(8px,1.2vh,12px) clamp(10px,1.2vw,14px);
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:6px;
}
.cell.cognac{ border-left:3px solid #8a6c2f; }
.cell.armagnac{ border-left:3px solid #6b5220; }
.cell b{ color:var(--or-clair); }

.tabmode .cellwrap{ grid-template-columns:1fr; }
.tabmode .cell{ display:none; }
.tabmode .cell.show{ display:block; }

footer{
  flex:0 0 auto;
  padding:clamp(8px,1.2vh,10px) clamp(14px,2vw,26px);
  border-top:1px solid rgba(201,162,39,0.2);
  text-align:center;
  font-size:clamp(0.62rem,1.2vw,0.72rem);
  color:rgba(255,255,255,0.5);
}
.body::-webkit-scrollbar{ width:6px; }
.body::-webkit-scrollbar-thumb{ background:rgba(201,162,39,0.4); border-radius:3px; }

@media (min-width:900px){
  .viewbar{ display:none; }
}
.foldbar{
  flex:0 0 auto;
  display:flex;
  justify-content:flex-end;
  padding:clamp(6px,1vh,10px) clamp(14px,2vw,26px) 0;
}
.foldbar button{
  font-family:inherit;
  font-size:clamp(0.68rem,1.4vw,0.8rem);
  font-weight:bold;
  padding:8px 14px;
  min-height:36px;
  border-radius:18px;
  border:1px solid rgba(201,162,39,0.5);
  background:transparent;
  color:var(--or-clair);
  cursor:pointer;
  transition:all .15s ease;
}
.foldbar button:hover{ background:rgba(201,162,39,0.12); }
@media (max-width:640px){
  header{ flex-wrap:wrap; }
  .duel-btn{ order:3; width:100%; text-align:center; }
}

/* ===== Overlay Mode Duel — fixed, jamais de push du .stage ===== */
.overlay{
  position:fixed; inset:0;
  z-index:20;
  background:rgba(20,17,15,0.92);
  display:none;
  align-items:center;
  justify-content:center;
  padding:clamp(10px,3vh,24px);
}
.overlay.show{ display:flex; }
.duel-card{
  width:100%;
  max-width:620px;
  max-height:100%;
  overflow-y:auto;
  background:var(--noir);
  border:1px solid var(--or);
  border-radius:14px;
  padding:clamp(16px,3vh,28px) clamp(16px,4vw,30px);
  box-shadow:0 0 30px rgba(201,162,39,0.25);
}
.duel-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:clamp(10px,2vh,16px);
}
.duel-score{
  font-size:clamp(0.75rem,1.6vw,0.9rem);
  color:var(--or-clair);
  font-weight:bold;
}
.duel-close{
  background:none; border:1px solid rgba(201,162,39,0.5);
  color:var(--blanc); border-radius:50%;
  width:36px; height:36px; min-height:36px;
  cursor:pointer; font-size:1rem;
}
.duel-crit{
  font-size:clamp(0.72rem,1.5vw,0.85rem);
  color:var(--or-clair);
  text-transform:uppercase;
  letter-spacing:0.05em;
  margin-bottom:6px;
}
.duel-fact{
  font-size:clamp(0.9rem,2.1vw,1.1rem);
  line-height:1.5;
  margin-bottom:clamp(14px,2.4vh,20px);
  min-height:2.4em;
}
.duel-choices{
  display:flex;
  gap:12px;
  margin-bottom:clamp(10px,1.8vh,14px);
}
.duel-choices button{
  flex:1;
  font-family:inherit;
  font-weight:bold;
  font-size:clamp(0.78rem,1.7vw,0.95rem);
  padding:clamp(11px,1.8vh,15px) 10px;
  min-height:48px;
  border-radius:10px;
  border:1px solid var(--or);
  background:transparent;
  color:var(--blanc);
  cursor:pointer;
  transition:all .15s ease;
}
.duel-choices button:hover:not(:disabled){ background:rgba(201,162,39,0.15); transform:translateY(-2px); }
.duel-choices button:disabled{ cursor:default; }
.duel-choices button.correct{ background:var(--vert-ok); border-color:var(--vert-ok); color:var(--blanc); }
.duel-choices button.wrong{ background:var(--rouge-err); border-color:var(--rouge-err); color:var(--blanc); }

.duel-reveal{
  display:none;
  background:rgba(255,255,255,0.04);
  border-left:3px solid var(--or);
  border-radius:8px;
  padding:12px 14px;
  font-size:clamp(0.72rem,1.5vw,0.85rem);
  line-height:1.5;
  margin-bottom:clamp(12px,2vh,16px);
}
.duel-reveal.show{ display:block; }
.duel-reveal b{ color:var(--or-clair); }

.duel-next{
  width:100%;
  font-family:inherit;
  font-weight:bold;
  font-size:clamp(0.8rem,1.7vw,0.95rem);
  padding:clamp(11px,1.8vh,14px);
  min-height:46px;
  border-radius:10px;
  border:none;
  background:var(--or);
  color:var(--noir);
  cursor:pointer;
  display:none;
}
.duel-next.show{ display:block; }

.duel-end{
  display:none;
  text-align:center;
}
.duel-end.show{ display:block; }
.duel-end .big{ font-size:clamp(1.6rem,4vw,2.2rem); color:var(--or-clair); font-weight:bold; margin:10px 0; }
</style>
</head>

<script>
const data = [
  ["Aire de production",
   "Région délimitée autour de Cognac : Charente, Charente-Maritime + quelques communes des Deux-Sèvres et Dordogne",
   "Sud-Ouest : Gers, Landes, Lot-et-Garonne. 3 zones : Bas-Armagnac, Ténarèze, Haut-Armagnac"],
  ["Statut AOC",
   "AOC Cognac (1936)",
   "AOC Armagnac (1936) + Blanche Armagnac (catégorie distincte)"],
  ["Cépages principaux",
   "Ugni Blanc majoritaire (&gt;90&nbsp;%), Folle Blanche, Colombard…",
   "Ugni Blanc, Baco 22A, Folle Blanche, Colombard (+ cépages traditionnels)"],
  ["Type de distillation",
   "Double distillation « à repasse » en alambic charentais en cuivre (forme d'oignon)",
   "Distillation continue en alambic armagnacais (majoritaire) ; double distillation minoritaire dans quelques maisons"],
  ["Période de distillation",
   "Du 1<sup>er</sup> novembre au 31 mars suivant la récolte",
   "De novembre au 31 mars également, parfois dates avancées par décret annuel"],
  ["Degré en sortie d'alambic",
   "&le;&nbsp;72&nbsp;% vol. (cœur de chauffe)",
   "Entre 52 et 60&nbsp;% vol. (jusqu'à 72&nbsp;% max autorisé)"],
  ["Vieillissement minimum",
   "Minimum 2 ans en fût de chêne (Limousin / Tronçais)",
   "Minimum 1 an en fût de chêne (Gascogne / Limousin)"],
  ["Mentions légales",
   "<b>VS</b>&nbsp;: &ge;&nbsp;2 ans&nbsp;; <b>VSOP</b>&nbsp;: &ge;&nbsp;4 ans&nbsp;; <b>XO</b>&nbsp;: &ge;&nbsp;10 ans&nbsp;; <b>XXO</b>&nbsp;: &ge;&nbsp;14 ans",
   "<b>VS/3★</b>&nbsp;: 1–3 ans&nbsp;; <b>VSOP</b>&nbsp;: 4–9 ans&nbsp;; <b>XO/Hors d'âge</b>&nbsp;: &ge;&nbsp;10 ans&nbsp;; millésimes fréquents (spécificité)"],
  ["Profils aromatiques",
   "Finesse, floralité, fruits blancs, boisé fin, « rancio » avec âge. Différences fortes selon les crus",
   "Plus corpulent, prune, raisin, fruits cuits, épices, rondeur ; « rancio » très marqué après long vieillissement"],
  ["Cru / Terroirs",
   "6 crus : Grande &amp; Petite Champagne, Borderies, Fins Bois, Bons Bois, Bois Ordinaires",
   "3 terroirs : Bas-Armagnac, Ténarèze, Haut-Armagnac"],
  ["Assemblage / Millésimes",
   "Assemblage presque systématique ; millésimes existants mais très rares",
   "Assemblage traditionnel + très forte culture du millésime (particularité armagnacaise)"],
  ["Marques emblématiques",
   "Hennessy, Martell, Rémy Martin, Courvoisier…",
   "Janneau, Darroze, Laubade, Tariquet, Delord, Clés des Ducs…"],
  ["Utilisation en cocktails",
   "Très présent dans les classiques : Sidecar, Brandy Alexander, Sazerac, Champagne Cocktail, Horse's Neck…",
   "Plus rare mais en développement : Armagnac Old Fashioned, Armagnac Sour, Armagnac Fizz…"],
  ["Style général",
   "Eau-de-vie plus douce, élégante, axée sur finesse et floralité",
   "Eau-de-vie plus rustique et aromatiquement puissante, fruits cuits &amp; épices"]

/* ---------- Tableau comparatif (plié/déplié) ---------- */
const rowsEl = document.getElementById('rows');
let html = "";
data.forEach(([label, cognac, armagnac], i) => {
  html += `<div class="row" data-idx="${i}">
    <div class="label">
      <span>${label}</span>
      <span class="chevron">▾</span>
    </div>
    <div class="cellwrap">
      <div class="cell cognac show" data-view="cognac">${cognac}</div>
      <div class="cell armagnac" data-view="armagnac">${armagnac}</div>
    </div>
  </div>`;
});
rowsEl.innerHTML = html;

// Déplier/replier une ligne au clic sur son libellé
document.querySelectorAll('.row .label').forEach(lbl=>{
  lbl.addEventListener('click', ()=> lbl.closest('.row').classList.toggle('open'));
});

// Bouton "Tout déplier / Tout replier"
const toggleAll = document.getElementById('toggleAll');
toggleAll.addEventListener('click', ()=>{
  const shouldOpen = toggleAll.dataset.mode === 'open';
  document.querySelectorAll('.row').forEach(r=> r.classList.toggle('open', shouldOpen));
  toggleAll.dataset.mode = shouldOpen ? 'close' : 'open';
  toggleAll.textContent = shouldOpen ? '⬍ Tout replier' : '⬍ Tout déplier';
});

const stage = document.getElementById('stage');
const viewbar = document.getElementById('viewbar');

function applyMobileClass(){
  const mobileMode = window.matchMedia('(max-width:899px)').matches;
  stage.classList.toggle('tabmode', mobileMode);
  if(mobileMode){
    showOnly('cognac');
  } else {
    document.querySelectorAll('.cell').forEach(c => c.classList.add('show'));
  }
}
function showOnly(view){
  document.querySelectorAll('.cell').forEach(c=>{
    c.classList.toggle('show', c.dataset.view === view);
  });
  viewbar.querySelectorAll('button').forEach(b=>{
    b.classList.toggle('active', b.dataset.view === view);
  });
}
viewbar.querySelectorAll('button').forEach(btn=>{
  btn.addEventListener('click', ()=> showOnly(btn.dataset.view));
});
window.addEventListener('resize', applyMobileClass);
applyMobileClass();

/* ---------- Mode Duel ---------- */
const overlay = document.getElementById('overlay');
const openDuel = document.getElementById('openDuel');
const closeDuel = document.getElementById('closeDuel');
const duelPlay = document.getElementById('duelPlay');
const duelEnd = document.getElementById('duelEnd');
const duelCrit = document.getElementById('duelCrit');
const duelFact = document.getElementById('duelFact');
const duelReveal = document.getElementById('duelReveal');
const duelNext = document.getElementById('duelNext');
const duelScore = document.getElementById('duelScore');
const duelFinal = document.getElementById('duelFinal');
const btnCognac = document.getElementById('btnCognac');
const btnArmagnac = document.getElementById('btnArmagnac');

let order = [];
let qIndex = 0;
let score = 0;
let answered = false;
const TOTAL_Q = 8;

function stripTags(s){
  const d = document.createElement('div');
  d.innerHTML = s;
  return d.textContent;
}

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function startDuel(){
  order = shuffle(data.map((_,i)=>i)).slice(0, TOTAL_Q);
  qIndex = 0;
  score = 0;
  duelPlay.style.display = 'block';
  duelEnd.classList.remove('show');
  loadQuestion();
  overlay.classList.add('show');
}

function loadQuestion(){
  answered = false;
  updateScore();
  const idx = order[qIndex];
  const [label, cognac, armagnac] = data[idx];
  const isCognac = Math.random() < 0.5;
  const factRaw = isCognac ? cognac : armagnac;
  duelCrit.textContent = `Critère ${qIndex+1}/${order.length} — ${label}`;
  duelFact.textContent = stripTags(factRaw);
  duelFact.dataset.answer = isCognac ? 'cognac' : 'armagnac';
  duelFact.dataset.idx = idx;
  duelReveal.classList.remove('show');
  duelNext.classList.remove('show');
  [btnCognac, btnArmagnac].forEach(b=>{
    b.disabled = false;
    b.classList.remove('correct','wrong');
  });
}

function answer(choice){
  if(answered) return;
  answered = true;
  const correct = duelFact.dataset.answer;
  const idx = parseInt(duelFact.dataset.idx, 10);
  const [label, cognac, armagnac] = data[idx];

  if(choice === correct) score++;
  (choice === 'cognac' ? btnCognac : btnArmagnac).classList.add(choice === correct ? 'correct' : 'wrong');
  if(choice !== correct){
    (correct === 'cognac' ? btnCognac : btnArmagnac).classList.add('correct');
  }
  btnCognac.disabled = true;
  btnArmagnac.disabled = true;

  duelReveal.innerHTML = `<b>Cognac</b> — ${cognac}<br><br><b>Armagnac</b> — ${armagnac}`;
  duelReveal.classList.add('show');
  duelNext.classList.add('show');
  updateScore();
}

function updateScore(){
  duelScore.textContent = `Score : ${score} / ${qIndex + (answered?1:0)}`;
}

function nextQuestion(){
  qIndex++;
  if(qIndex >= order.length){
    endDuel();
  } else {
    loadQuestion();
  }
}

function endDuel(){
  duelPlay.style.display = 'none';
  duelEnd.classList.add('show');
  duelFinal.textContent = `${score} / ${order.length}`;
}

openDuel.addEventListener('click', startDuel);
closeDuel.addEventListener('click', ()=> overlay.classList.remove('show'));
overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.classList.remove('show'); });
btnCognac.addEventListener('click', ()=> answer('cognac'));
btnArmagnac.addEventListener('click', ()=> answer('armagnac'));
duelNext.addEventListener('click', nextQuestion);
document.getElementById('duelRestart').addEventListener('click', startDuel);
</script>
</body>
</html>
