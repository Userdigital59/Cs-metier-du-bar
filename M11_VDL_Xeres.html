<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les types de Xérès | CS Métiers du Bar</title>
<style>
:root{
  --noir:#14110F;
  --or:#C9A227;
  --or-clair:#E3C766;
  --blanc:#FFFFFF;
  --rouge-err:#8B2E2E;
  --vert-ok:#3E6B4F;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;}
html,body{height:100%;overflow:hidden;}
body{
  height:100vh;height:100dvh;
  background:var(--noir);color:var(--blanc);
  display:flex;flex-direction:column;align-items:center;position:relative;
}
body::before{
  content:"";position:fixed;inset:0;
  background:
    radial-gradient(circle at 15% 10%, rgba(201,162,39,0.10), transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(201,162,39,0.08), transparent 45%),
    repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 4px);
  pointer-events:none;z-index:0;
}
header{
  width:100%;max-width:1000px;
  padding:clamp(10px,2vh,18px) clamp(12px,3vw,24px) clamp(6px,1vh,10px);
  text-align:center;position:relative;z-index:1;flex:0 0 auto;
}
header img.logo{width:clamp(38px,6vh,54px);height:auto;display:block;margin:0 auto 6px;}
header h1{color:var(--or);font-size:clamp(1.05rem,2.4vw,1.5rem);letter-spacing:1px;text-transform:uppercase;}
header .sub{color:var(--or-clair);font-size:clamp(0.68rem,1.3vw,0.85rem);margin-top:3px;}
.badge-public{
  display:inline-block;margin-top:6px;padding:3px 12px;
  border:1px solid rgba(201,162,39,0.5);border-radius:20px;
  font-size:clamp(0.6rem,1vw,0.72rem);color:var(--or-clair);
  letter-spacing:1px;text-transform:uppercase;
}

.stage{
  width:100%;max-width:1000px;flex:1 1 auto;
  display:flex;flex-direction:column;position:relative;z-index:1;
  overflow:hidden;padding:0 clamp(10px,3vw,20px) clamp(10px,2vh,16px);
  min-height:0;
}
.instruction{
  text-align:center;color:rgba(255,255,255,0.65);
  font-size:clamp(0.7rem,1.3vw,0.85rem);
  margin-bottom:clamp(8px,1.6vh,14px);flex:0 0 auto;
}
.instruction b{color:var(--or-clair);}
.tabs{display:none;}

.familles{
  flex:1 1 auto;display:flex;gap:clamp(10px,1.8vw,20px);min-height:0;
}
.famille{
  flex:1;display:flex;flex-direction:column;
  border:1px solid rgba(201,162,39,0.35);border-radius:12px;
  background:rgba(255,255,255,0.02);
  padding:clamp(10px,1.6vh,16px) clamp(10px,1.6vw,16px);
  min-height:0;
}
.famille .fam-head{flex:0 0 auto;margin-bottom:clamp(8px,1.4vh,14px);}
.famille h2{
  color:var(--or);font-size:clamp(0.85rem,1.6vw,1.05rem);
  text-transform:uppercase;letter-spacing:0.4px;
}
.famille .degre{
  color:var(--or-clair);font-size:clamp(0.62rem,1.1vw,0.76rem);
  margin-top:2px;
}
.famille .fam-desc{
  color:rgba(255,255,255,0.6);font-size:clamp(0.62rem,1.1vw,0.76rem);
  margin-top:4px;line-height:1.3;
  border-top:1px solid rgba(201,162,39,0.25);padding-top:6px;
}

.cards{
  flex:1;display:flex;flex-direction:column;
  gap:clamp(8px,1.6vh,16px);justify-content:space-between;min-height:0;overflow:hidden;
}
.card{
  background:rgba(201,162,39,0.08);
  border:1px solid rgba(201,162,39,0.4);border-radius:10px;
  padding:clamp(10px,1.8vh,18px) clamp(12px,1.6vw,18px);
  cursor:pointer;text-align:left;color:var(--blanc);
  flex:1;min-height:44px;display:flex;flex-direction:column;justify-content:center;
  transition:transform .18s,background .18s,border-color .18s;width:100%;
}
.card:hover,.card:focus-visible{
  background:rgba(201,162,39,0.18);border-color:var(--or);transform:translateY(-2px);
}
.card:focus-visible{outline:3px solid var(--or-clair);outline-offset:2px;}
.card .nom{
  font-size:clamp(0.85rem,1.6vw,1.05rem);color:var(--or-clair);font-weight:bold;
}
.card .tag{
  font-size:clamp(0.66rem,1.15vw,0.8rem);color:rgba(255,255,255,0.72);
  margin-top:3px;
}
.card .full-desc{
  font-size:clamp(0.66rem,1.1vw,0.78rem);color:rgba(255,255,255,0.58);
  margin-top:6px;line-height:1.35;
  padding-top:6px;border-top:1px solid rgba(201,162,39,0.2);
}

/* Décor flottant */
.deco{
  position:fixed;z-index:0;opacity:0.11;pointer-events:none;filter:saturate(0.9);
}
.deco-shaker{bottom:-40px;left:-60px;width:260px;transform:rotate(-6deg);}
.deco-femme{top:-70px;right:-120px;width:380px;transform:rotate(4deg);}
@media (max-width:760px){.deco{display:none;}}

/* Overlay détail */
.overlay{
  position:fixed;inset:0;z-index:10;background:rgba(20,17,15,0.90);
  opacity:0;pointer-events:none;transition:opacity .25s;
  display:flex;align-items:center;justify-content:center;padding:clamp(14px,4vw,30px);
}
.overlay.visible{opacity:1;pointer-events:auto;}
.detail-panel{
  width:100%;max-width:480px;max-height:100%;overflow-y:auto;
  background:var(--noir);border:1px solid var(--or);border-radius:14px;
  padding:clamp(18px,3.5vw,28px);position:relative;box-shadow:0 12px 40px rgba(0,0,0,0.6);
}
.detail-panel .close{
  position:absolute;top:10px;right:10px;width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;
  background:transparent;border:1px solid rgba(201,162,39,0.5);
  border-radius:50%;color:var(--or-clair);font-size:1.1rem;cursor:pointer;
}
.detail-panel .close:hover{background:rgba(201,162,39,0.15);}
.detail-panel .close:focus-visible{outline:3px solid var(--or-clair);outline-offset:2px;}
.detail-panel h3{
  color:var(--or);font-size:clamp(1.1rem,2.6vw,1.4rem);
  text-transform:uppercase;letter-spacing:0.5px;margin:0 40px 12px 0;line-height:1.2;
}
.detail-row{display:flex;gap:10px;margin-bottom:10px;font-size:clamp(0.82rem,1.6vw,0.94rem);line-height:1.4;}
.detail-row .ico{flex:0 0 auto;width:26px;text-align:center;color:var(--or-clair);}
.detail-row .label{color:rgba(255,255,255,0.68);font-size:0.78em;display:block;}
.detail-panel .specificite{
  margin-top:14px;padding-top:12px;border-top:1px solid rgba(201,162,39,0.3);
  font-size:clamp(0.82rem,1.6vw,0.94rem);line-height:1.5;color:var(--blanc);
}
.detail-panel .specificite b{color:var(--or-clair);}

footer{
  width:100%;text-align:center;color:rgba(255,255,255,0.4);
  font-size:clamp(0.6rem,1vw,0.7rem);
  padding:clamp(4px,1vh,8px) 10px;flex:0 0 auto;position:relative;z-index:1;
}

/* Tablette */
@media (max-width:899px){
  .familles{flex-direction:column;overflow-y:auto;}
  .famille{flex:0 0 auto;}
  .cards{justify-content:flex-start;}
}
/* Mobile : onglets */
@media (max-width:640px){
  .tabs{display:flex;gap:6px;margin-bottom:8px;flex:0 0 auto;}
  .tab-btn{
    flex:1;min-height:40px;background:rgba(255,255,255,0.04);
    border:1px solid rgba(201,162,39,0.35);border-radius:8px;
    color:var(--or-clair);font-size:0.68rem;text-transform:uppercase;
    letter-spacing:0.4px;cursor:pointer;padding:4px;line-height:1.15;
  }
  .tab-btn.active{background:var(--or);color:var(--noir);border-color:var(--or);font-weight:bold;}
  .familles{flex-direction:column;}
  .famille{display:none;flex:1;}
  .famille.active{display:flex;}
}
</style>
</head>

  <h1>Les types de Xérès</h1>
  <div class="sub">Finos et Olorosos : deux familles, deux caractères</div>
  <div class="badge-public">Contenu apprenant</div>
</header>

<div class="stage">
  <div class="instruction">Touche un type pour découvrir ses <b>caractéristiques</b> et son <b>accord</b></div>
  <div class="tabs" id="tabs"></div>
  <div class="familles" id="familles"></div>
</div>

<footer>Module 3.4 — Le Xérès · CS Métiers du Bar</footer>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="dTitre">
  <div class="detail-panel">
    <button class="close" id="closeBtn" aria-label="Fermer la fiche détail">✕</button>
    <h3 id="dTitre"></h3>
    <div class="detail-row"><div class="ico" aria-hidden="true">🍇</div><div><span class="label">Élaboration</span><span id="dElab"></span></div></div>
    <div class="detail-row"><div class="ico" aria-hidden="true">🍽️</div><div><span class="label">Accord / service</span><span id="dAccord"></span></div></div>
    <div class="specificite" id="dSpecif"></div>
  </div>
</div>

<script>
const familles = [
  {
    nom: "Les Finos",
    degre: "Vins très secs et légers — 15°",
    famDesc: "Vieillis sous voile (flor), non oxydés, préservent la fraîcheur du vin blanc.",
    cats: [
      {
        nom: "Manzanilla",
        tag: "Sanlucar de Barrameda — iodé",
        full: "Élevé en bord de mer, saveurs iodées · apéritif, fruits de mer",
        elab: "Vin élevé à Sanlucar de Barrameda, ville côtière andalouse.",
        accord: "En apéritif ou avec des fruits de mer.",
        specif: "Sa proximité avec l'océan lui apporte des <b>saveurs iodées</b> caractéristiques, distinctes des autres finos élevés à Jerez."
      },
      {
        nom: "Fino",
        tag: "Frais, arômes d'amandes",
        full: "Élevé sous voile à Jerez · frais, notes d'amandes · apéritif",
        elab: "Élevé sous voile (flor) à Jerez de la Frontera.",
        accord: "En apéritif.",
        specif: "Vin <b>frais</b>, reconnaissable à ses arômes d'amandes."
      },
      {
        nom: "Amontillado",
        tag: "Vieux fino, sec, note de rancio",
        full: "Fino ayant perdu son voile · sec, note de rancio · fromages",
        elab: "Fino ayant vieilli au point de perdre son voile — il n'est plus protégé de l'oxydation.",
        accord: "Avec les fromages.",
        specif: "Un <b>vieux fino qui n'est plus oxydé par le voile</b> (celui-ci a disparu) : sec, avec une note de rancio caractéristique."
      },
      {
        nom: "Fino-Amontillado",
        tag: "Style intermédiaire",
        full: "Étape de transition entre Fino et Amontillado",
        elab: "Étape de transition entre Fino et Amontillado.",
        accord: "En apéritif ou avec les fromages, selon l'évolution.",
        specif: "Vin <b>intermédiaire entre le Fino et l'Amontillado</b>, à un stade transitoire de son évolution sous voile."
      }
    ]
  },
  {
    nom: "Les Olorosos",
    degre: "Vins plus charpentés — 18 à 20°",
    famDesc: "Vinifiés sans flor (ou après sa disparition), arômes évoquant le Whisky.",
    cats: [
      {
        nom: "Oloroso",
        tag: "Vinifié sans flor, le plus souvent sec",
        full: "Sans voile, exposé à l'oxydation · arômes de Whisky · digestif",
        elab: "Vinifié sans voile (flor), ce qui l'expose directement à l'oxydation.",
        accord: "Généralement en digestif ou à table selon le style.",
        specif: "Le plus souvent <b>sec</b>, aux arômes charpentés évoquant le Whisky."
      },
      {
        nom: "Cream",
        tag: "Doux — assemblage Pedro Ximénez",
        full: "Assemblé avec du Pedro Ximénez (raisin séché) · doux · digestif",
        elab: "Assemblé avec du Pedro Ximénez, raisin séché au soleil.",
        accord: "En digestif.",
        specif: "Style <b>doux</b>, obtenu par assemblage avec du <b>Pedro Ximénez</b> (raisin séché au soleil)."
      },
      {
        nom: "Pale Cream",
        tag: "Assemblage Cream + Fino, couleur pâle",
        full: "Assemblage Cream + Fino · couleur pâle par traitement · apéritif",
        elab: "Assemblage de Cream et de Fino ; couleur pâle obtenue par traitement.",
        accord: "En apéritif, plus léger qu'un Cream classique.",
        specif: "Résulte de l'<b>assemblage de Cream et de Fino</b>. Sa couleur pâle est obtenue par traitement."
      }
    ]
  }
];

const familiesEl = document.getElementById('familles');
const tabsEl = document.getElementById('tabs');

familles.forEach((fam, i) => {
  const famDiv = document.createElement('div');
  famDiv.className = 'famille' + (i===0 ? ' active' : '');

  const head = document.createElement('div');
  head.className = 'fam-head';
  head.innerHTML = `<h2>${fam.nom}</h2><div class="degre">${fam.degre}</div><div class="fam-desc">${fam.famDesc}</div>`;
  famDiv.appendChild(head);

  const cardsDiv = document.createElement('div');
  cardsDiv.className = 'cards';

  fam.cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'card';
    btn.innerHTML = `<span class="nom">${cat.nom}</span><span class="tag">${cat.tag}</span><span class="full-desc">${cat.full}</span>`;
    btn.addEventListener('click', () => openDetail(cat, btn));
    cardsDiv.appendChild(btn);
  });

  famDiv.appendChild(cardsDiv);
  familiesEl.appendChild(famDiv);

  const tabBtn = document.createElement('button');
  tabBtn.className = 'tab-btn' + (i===0 ? ' active' : '');
  tabBtn.textContent = fam.nom;
  tabBtn.addEventListener('click', () => {
    document.querySelectorAll('.famille').forEach(f => f.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
    famDiv.classList.add('active');
    tabBtn.classList.add('active');
  });
  tabsEl.appendChild(tabBtn);
});

const overlay = document.getElementById('overlay');
const closeBtn = document.getElementById('closeBtn');
let lastFocused = null;

function openDetail(cat, triggerBtn){
  lastFocused = triggerBtn || document.activeElement;
  document.getElementById('dTitre').textContent = cat.nom;
  document.getElementById('dElab').textContent = cat.elab;
  document.getElementById('dAccord').textContent = cat.accord;
  document.getElementById('dSpecif').innerHTML = cat.specif;
  overlay.classList.add('visible');
  closeBtn.focus();
  document.addEventListener('keydown', onKeydown);
}
function closeDetail(){
  overlay.classList.remove('visible');
  document.removeEventListener('keydown', onKeydown);
  if(lastFocused) lastFocused.focus();
}
function onKeydown(e){ if(e.key === 'Escape') closeDetail(); }
closeBtn.addEventListener('click', closeDetail);
overlay.addEventListener('click', (e) => { if(e.target === overlay) closeDetail(); });
</script>

</body>
</html>
