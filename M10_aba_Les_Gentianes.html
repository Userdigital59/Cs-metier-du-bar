<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Les Gentianes — Marques</title>
<style>
:root{
  --noir:#14110F;
  --or:#C9A227;
  --or-clair:#E3C766;
  --blanc:#FFFFFF;
  --rouge-err:#8B2E2E;
  --vert-ok:#3E6B4F;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{
  height:100dvh;
  overflow:hidden;
  background:var(--noir);
  color:var(--blanc);
  font-family:Arial, Helvetica, sans-serif;
  position:relative;
}
body::before{
  content:"";
  position:fixed; inset:0;
  background:
    radial-gradient(circle at 15% 10%, rgba(201,162,39,0.10), transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(201,162,39,0.08), transparent 45%),
    repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 4px);
  pointer-events:none;
  z-index:0;
}

.stage{
  position:relative;
  z-index:1;
  height:100dvh;
  max-width:1100px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  padding:clamp(10px,2vh,20px) clamp(12px,3vw,28px);
  gap:clamp(6px,1.4vh,14px);
}

/* HEADER */
.header{
  display:flex;
  align-items:center;
  gap:clamp(10px,2vw,18px);
  flex-shrink:0;
}
.logo{
  width:clamp(46px,6vw,64px);
  height:clamp(46px,6vw,64px);
  border-radius:50%;
  background:var(--blanc);
  border:2px solid var(--or);
  padding:4px;
  flex-shrink:0;
  box-shadow:0 0 14px rgba(201,162,39,0.35);
}
.logo img{ width:100%; height:100%; object-fit:contain; display:block; }
.header-txt h1{
  font-size:clamp(1.1rem,2.6vw,1.7rem);
  color:var(--or-clair);
  letter-spacing:0.03em;
}
.header-txt p{
  font-size:clamp(0.7rem,1.4vw,0.85rem);
  color:rgba(255,255,255,0.75);
  margin-top:2px;
}
.header-txt .highlight{ color:var(--or); font-weight:bold; }

/* INTRO PAYS */
.pays-band{
  flex-shrink:0;
  border:1px solid rgba(201,162,39,0.35);
  border-radius:10px;
  background:rgba(201,162,39,0.06);
  padding:clamp(6px,1.2vh,10px) clamp(10px,2vw,16px);
  font-size:clamp(0.68rem,1.3vw,0.82rem);
  display:flex;
  flex-wrap:wrap;
  gap:6px 18px;
}
.pays-band b{ color:var(--or-clair); }

/* GRID */
.grid{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:clamp(8px,1.6vw,16px);
}
.card{
  position:relative;
  border:1px solid rgba(201,162,39,0.35);
  border-radius:14px;
  background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:clamp(8px,1.6vh,14px) clamp(6px,1vw,10px) clamp(10px,1.6vh,14px);
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  overflow:hidden;
}
.card:hover, .card:focus-visible{
  transform:translateY(-4px);
  border-color:var(--or);
  box-shadow:0 8px 22px rgba(201,162,39,0.22);
}
.card .thumb-wrap{
  flex:1;
  min-height:0;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}
.card img.thumb{
  max-height:100%;
  max-width:100%;
  object-fit:contain;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,0.5));
}
.card .name{
  margin-top:clamp(6px,1vh,10px);
  font-size:clamp(0.78rem,1.6vw,1rem);
  font-weight:bold;
  color:var(--or-clair);
  text-align:center;
  letter-spacing:0.02em;
}
.card .deg{
  margin-top:3px;
  font-size:clamp(0.62rem,1.2vw,0.72rem);
  background:var(--or);
  color:var(--noir);
  border-radius:20px;
  padding:2px 10px;
  font-weight:bold;
}
.card .tap-hint{
  margin-top:4px;
  font-size:clamp(0.58rem,1.1vw,0.66rem);
  color:rgba(255,255,255,0.5);
}

/* OVERLAY FICHE */
.overlay{
  position:fixed; inset:0;
  z-index:20;
  background:rgba(10,8,6,0.88);
  backdrop-filter:blur(2px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:clamp(10px,3vh,30px);
  opacity:0;
  pointer-events:none;
  transition:opacity .2s ease;
}
.overlay.active{ opacity:1; pointer-events:auto; }
.sheet{
  width:100%;
  max-width:760px;
  max-height:100%;
  overflow-y:auto;
  background:linear-gradient(180deg, #1b1712, var(--noir));
  border:1px solid var(--or);
  border-radius:16px;
  padding:clamp(14px,2.6vh,26px) clamp(14px,3vw,30px);
  position:relative;
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
}
.sheet::-webkit-scrollbar{ width:6px; }
.sheet::-webkit-scrollbar-thumb{ background:var(--or); border-radius:4px; }

.close-btn{
  position:absolute;
  top:10px; right:10px;
  width:36px; height:36px;
  border-radius:50%;
  border:1px solid var(--or);
  background:rgba(255,255,255,0.04);
  color:var(--or-clair);
  font-size:1.2rem;
  line-height:1;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.close-btn:hover{ background:var(--or); color:var(--noir); }

.sheet-top{
  display:flex;
  gap:clamp(14px,3vw,24px);
  align-items:flex-start;
  flex-wrap:wrap;
}
.sheet-img-wrap{
  flex:0 0 auto;
  width:clamp(90px,20vw,140px);
  cursor:zoom-in;
  border-radius:10px;
  overflow:hidden;
  position:relative;
}
.sheet-img-wrap img{
  width:100%; display:block;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,0.55));
  transition:transform .2s ease;
}
.sheet-img-wrap:hover img{ transform:scale(1.05); }
.zoom-icon{
  position:absolute; bottom:4px; right:4px;
  background:rgba(201,162,39,0.9);
  color:var(--noir);
  width:22px; height:22px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:0.8rem;
}
.sheet-head{ flex:1; min-width:180px; }
.sheet-head h2{
  color:var(--or-clair);
  font-size:clamp(1.1rem,2.6vw,1.5rem);
}
.sheet-head .deg-lg{
  display:inline-block;
  margin-top:6px;
  background:var(--or);
  color:var(--noir);
  font-weight:bold;
  border-radius:20px;
  padding:3px 12px;
  font-size:clamp(0.72rem,1.4vw,0.85rem);
}
.sheet-head .region{
  margin-top:8px;
  font-size:clamp(0.72rem,1.4vw,0.85rem);
  color:rgba(255,255,255,0.7);
}

.sheet-block{
  margin-top:clamp(12px,2vh,18px);
  border-top:1px solid rgba(201,162,39,0.25);
  padding-top:clamp(8px,1.4vh,12px);
}
.sheet-block h3{
  font-size:clamp(0.72rem,1.3vw,0.82rem);
  text-transform:uppercase;
  letter-spacing:0.06em;
  color:var(--or);
  margin-bottom:6px;
}
.sheet-block p{
  font-size:clamp(0.78rem,1.5vw,0.92rem);
  line-height:1.5;
  color:rgba(255,255,255,0.92);
}
.sheet-block.service{
  background:rgba(62,107,79,0.12);
  border:1px solid rgba(62,107,79,0.4);
  border-radius:10px;
  padding:10px 12px;
}
.sheet-block.service h3{ color:var(--vert-ok); }

/* LIGHTBOX ZOOM */
.lightbox{
  position:fixed; inset:0;
  z-index:40;
  background:rgba(0,0,0,0.94);
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none;
  transition:opacity .2s ease;
}
.lightbox.active{ opacity:1; pointer-events:auto; }
.lightbox img{
  max-width:80vw;
  max-height:80dvh;
  object-fit:contain;
  filter:drop-shadow(0 10px 30px rgba(0,0,0,0.7));
  cursor:zoom-out;
}
.lightbox .lb-hint{
  position:absolute;
  bottom:clamp(14px,4vh,30px);
  color:rgba(255,255,255,0.6);
  font-size:0.8rem;
}

/* Decor */
.deco{
  position:fixed;
  opacity:0.10;
  z-index:0;
  pointer-events:none;
}

@media (max-width:760px){
  .deco{ display:none; }
}
@media (max-width:899px) and (min-width:641px){
  .grid{ grid-template-columns:repeat(2,1fr); grid-auto-rows:1fr; }
}
@media (max-width:640px){
  .grid{ grid-template-columns:repeat(2,1fr); grid-auto-rows:1fr; }
  .header-txt p{ display:none; }
  .pays-band{ font-size:0.62rem; padding:5px 8px; gap:4px 10px; }
}
</style>
</head>

const grid = document.getElementById('grid');
marques.forEach(m => {
  const card = document.createElement('div');
  card.className = 'card';
  card.tabIndex = 0;
  card.innerHTML = `
    <div class="thumb-wrap"><img class="thumb" src="${m.img}" alt="${m.nom}"></div>
    <div class="name">${m.nom}</div>
    <div class="deg">${m.degre}</div>
    <div class="tap-hint">Toucher pour la fiche</div>
  `;
  const open = () => openSheet(m);
  card.addEventListener('click', open);
  card.addEventListener('keydown', e => { if(e.key==='Enter' || e.key===' ') open(); });
  grid.appendChild(card);
});

const overlay = document.getElementById('overlay');
const sheet = document.getElementById('sheet');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');

function openSheet(m){
  sheet.innerHTML = `
    <button class="close-btn" id="closeSheet" aria-label="Fermer">&times;</button>
    <div class="sheet-top">
      <div class="sheet-img-wrap" id="zoomTrigger">
        <img src="${m.img}" alt="${m.nom}">
        <div class="zoom-icon">+</div>
      </div>
      <div class="sheet-head">
        <h2>${m.nom}</h2>
        <div class="deg-lg">${m.degre}</div>
        <div class="region">${m.region}</div>
      </div>
    </div>
    <div class="sheet-block">
      <h3>Historique</h3>
      <p>${m.historique}</p>
    </div>
    <div class="sheet-block service">
      <h3>Service</h3>
      <p>${m.service}</p>
    </div>
  `;
  overlay.classList.add('active');
  document.getElementById('closeSheet').addEventListener('click', closeSheet);
  document.getElementById('zoomTrigger').addEventListener('click', () => openZoom(m.img, m.nom));
}
function closeSheet(){ overlay.classList.remove('active'); }
overlay.addEventListener('click', e => { if(e.target === overlay) closeSheet(); });

function openZoom(src, alt){
  lightboxImg.src = src;
  lightboxImg.alt = alt;
  lightbox.classList.add('active');
}
lightbox.addEventListener('click', () => lightbox.classList.remove('active'));

document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ lightbox.classList.remove('active'); closeSheet(); }
});
</script>
