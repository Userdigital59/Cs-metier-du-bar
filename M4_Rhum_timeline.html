<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Histoire du rhum — Chronologie</title>
<style>
:root{
  --noir:#14110F;
  --or:#C9A227;
  --or-clair:#E3C766;
  --blanc:#FFFFFF;
  --rouge-err:#8B2E2E;
  --vert-ok:#3E6B4F;
}

*{box-sizing:border-box; margin:0; padding:0;}
html, body{ height:100%; overflow:hidden; }
body{
  height:100vh; height:100dvh;
  display:flex; align-items:center; justify-content:center;
  background:var(--noir);
  color:var(--blanc);
  font-family:Arial, Helvetica, sans-serif;
  position:relative;
}
body::before{
  content:"";
  position:fixed; inset:0;
  background:
    radial-gradient(circle at 15% 10%, rgba(201,162,39,0.10), transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(201,162,39,0.08), transparent 45%),
    repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 4px);
  pointer-events:none;
  z-index:0;
}
.deco{ position:fixed; opacity:0.10; pointer-events:none; z-index:0; width:clamp(90px, 14vw, 220px); }
.deco.shaker{ bottom:2%; right:2%; }
@media (max-width:760px){ .deco{ display:none; } }

.stage{
  position:relative; z-index:1;
  width:100%; max-width:980px;
  height:100%; max-height:660px;
  margin:clamp(6px, 2vh, 20px);
  display:flex; flex-direction:column;
  overflow:hidden;
  border:1px solid rgba(201,162,39,0.35);
  border-radius:14px;
  padding:clamp(12px, 2.2vw, 26px);
  background:rgba(20,17,15,0.55);
}

header.head{
  display:flex; align-items:center; gap:clamp(8px, 1.5vw, 16px);
  flex:0 0 auto;
  padding-bottom:clamp(8px, 1.2vh, 12px);
  border-bottom:1px solid rgba(201,162,39,0.25);
}
header.head img.logo{ width:clamp(30px, 4.5vw, 50px); height:auto; flex:0 0 auto; }
header.head h1{ font-size:clamp(15px, 2.4vw, 23px); color:var(--or-clair); flex:1; }
header.head .subtitle{ font-size:clamp(10px, 1.2vw, 12.5px); color:rgba(255,255,255,0.55); display:none; }
@media (min-width:641px){ header.head .subtitle{ display:block; } }

.era-tabs{
  flex:0 0 auto;
  display:flex; gap:clamp(4px,1vw,8px);
  padding:clamp(8px,1.4vh,12px) 0;
  overflow-x:auto;
  scrollbar-width:none;
}
.era-tabs::-webkit-scrollbar{ display:none; }
.era-btn{
  flex:0 0 auto;
  appearance:none; border:1px solid var(--or);
  background:transparent; color:var(--or-clair);
  font-family:Arial, Helvetica, sans-serif; font-weight:bold;
  font-size:clamp(11px, 1.5vw, 14px);
  padding:clamp(8px,1.2vh,10px) clamp(12px,2vw,18px);
  border-radius:20px; cursor:pointer;
  min-height:40px;
  transition:background .2s, color .2s, transform .15s;
  white-space:nowrap;
}
.era-btn:hover{ transform:translateY(-1px); }
.era-btn.active{ background:var(--or); color:var(--noir); box-shadow:0 0 10px rgba(201,162,39,0.5); }

.cards-zone{
  flex:1; min-height:0;
  overflow-y:auto;
  padding:clamp(6px,1vh,10px) clamp(2px,0.5vw,6px);
}
.cards-zone::-webkit-scrollbar{ width:5px; }
.cards-zone::-webkit-scrollbar-thumb{ background:rgba(201,162,39,0.4); border-radius:3px; }

.cards-grid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:clamp(8px, 1.4vw, 14px);
}
@media (max-width:899px){ .cards-grid{ grid-template-columns:repeat(2, 1fr); } }
@media (max-width:480px){ .cards-grid{ grid-template-columns:1fr; } }

.card{
  border:1px solid rgba(201,162,39,0.35);
  border-radius:10px;
  padding:clamp(10px,1.6vh,14px) clamp(10px,1.4vw,14px);
  cursor:pointer;
  background:rgba(255,255,255,0.03);
  transition:transform .15s, background .15s, border-color .15s;
  display:flex; flex-direction:column; gap:4px;
  min-height:44px;
}
.card:hover{ transform:translateY(-2px); background:rgba(201,162,39,0.08); border-color:var(--or); }
.card .badge{
  align-self:flex-start;
  font-size:clamp(10px,1.3vw,12px);
  font-weight:bold;
  color:var(--noir);
  background:var(--or);
  padding:2px 8px;
  border-radius:6px;
}
.card .card-title{
  font-size:clamp(12.5px, 1.7vw, 14.5px);
  font-weight:bold;
  color:var(--blanc);
  line-height:1.3;
}
.card .card-hint{
  font-size:clamp(10px, 1.2vw, 11px);
  color:rgba(255,255,255,0.4);
  margin-top:auto;
}

footer.foot{
  flex:0 0 auto;
  text-align:center;
  font-size:10px;
  color:rgba(255,255,255,0.3);
  padding-top:6px;
}

/* Overlay détail rétractable */
.overlay{
  position:fixed; inset:0;
  background:rgba(20,17,15,0.90);
  opacity:0; pointer-events:none;
  transition:opacity .25s;
  z-index:10;
  display:flex; align-items:center; justify-content:center;
  padding:clamp(10px,3vh,30px);
}
.overlay.visible{ opacity:1; pointer-events:auto; }
.detail-panel{
  width:100%; max-width:640px;
  max-height:100%;
  overflow-y:auto;
  border:1px solid var(--or);
  border-radius:14px;
  background:var(--noir);
  padding:clamp(16px,3vw,30px);
  position:relative;
}
.detail-panel::-webkit-scrollbar{ width:5px; }
.detail-panel::-webkit-scrollbar-thumb{ background:rgba(201,162,39,0.5); border-radius:3px; }

.detail-badge{
  display:inline-block;
  font-size:clamp(11px,1.5vw,13px);
  font-weight:bold;
  color:var(--noir);
  background:var(--or);
  padding:3px 12px;
  border-radius:8px;
  margin-bottom:10px;
}
.detail-title{
  font-size:clamp(17px, 2.6vw, 22px);
  color:var(--or-clair);
  font-weight:bold;
  margin-bottom:12px;
  line-height:1.3;
}
.detail-text{
  font-size:clamp(13px, 1.8vw, 15.5px);
  color:rgba(255,255,255,0.9);
  line-height:1.6;
}
.close-btn{
  position:absolute; top:clamp(10px,2vw,16px); right:clamp(10px,2vw,16px);
  appearance:none; border:1px solid var(--or); background:transparent;
  color:var(--or-clair); font-size:16px; font-weight:bold;
  width:36px; height:36px; border-radius:50%;
  cursor:pointer; min-height:44px; min-width:44px;
  display:flex; align-items:center; justify-content:center;
  transition:background .2s;
}
.close-btn:hover{ background:rgba(201,162,39,0.15); }
</style>
</head>

<script>
const eras = [
  {
    id:'origines', label:'Avant le XVIIe',
    events:[
      { year:"6000 av. J.-C. – 325 av. J.-C.", title:"Les origines lointaines de la canne à sucre",
        text:"Certains historiens font remonter à 6 000 ans avant J.-C. l'utilisation de la canne à sucre dans l'alimentation des Chinois. C'est dans la vallée de l'Indus (Pakistan) que les armées d'Alexandre le Grand découvrent, en 325 avant J.-C., « ce roseau qui donne du miel sans le concours des abeilles ». Originaire d'Inde bien avant J.-C., où elle est cultivée pour produire du sucre, la canne à sucre voit sa culture s'étendre peu à peu au monde entier dans le sillage des grands voyageurs : Alexandre le Grand, Marco Polo, puis Christophe Colomb, qui l'introduit aux Antilles à la fin du XVe siècle." },
      { year:"1493", title:"Christophe Colomb introduit la canne à Haïti",
        text:"Lors de son deuxième voyage vers le Nouveau Monde, Christophe Colomb introduit la canne à sucre dans l'archipel des Antilles. Les premières plantations auraient été faites sur l'île d'Hispaniola (Haïti et Saint-Domingue)." },
      { year:"1516", title:"Première cargaison de sucre vers l'Espagne",
        text:"D'Hispaniola serait partie, en 1516, la première cargaison de sucre à destination de l'Espagne. La présence de la canne à sucre dans les Caraïbes remonterait donc à la colonisation espagnole au XVIe siècle." },
      { year:"XVIe siècle", title:"Essor des cultures vivrières et naissance de la Guildive",
        text:"Avec l'arrivée des colons et l'implantation des cultures vivrières (cultures tournées vers l'autoconsommation et l'économie de subsistance), des modes de fabrication d'alcools empiriques voient le jour, comme celui de la « Guildive » (de l'anglais « Kill-devil », Tue-Diable), eau-de-vie de canne rudimentaire produite dans les îles Caraïbes." },
      { year:"1635", title:"La canne à sucre arrive en Martinique",
        text:"Les colonies françaises des Caraïbes sont occupées depuis 1635 : c'est le point de départ de l'implantation de la canne à sucre en Martinique, et donc de la grande histoire rhumière française." },
      { year:"XVIe siècle", title:"Naissance de la cachaça au Brésil",
        text:"L'histoire de la cachaça débute vraiment vers le XVIe siècle, après l'arrivée des Portugais qui apportent avec eux une méthode d'élaboration. D'abord consommé frais et bouilli par les esclaves, le jus de canne (garapa) sera ensuite fermenté puis distillé, sur le modèle du rhum. Elle deviendra la boisson nationale brésilienne." },
      { year:"Étymologie", title:"D'où vient le mot « rhum » ?",
        text:"Trois origines plausibles sont avancées : la contraction de « rumbullion », grand tumulte des bagarres de marins ivres en patois du Yorkshire ; la contraction de « rumbullion », « rheu » (tige) et « bullion » (bouillon) en patois créole ; ou encore la contraction du terme latin saccharum, signifiant sucre." }
    ]
  },
  {
    id:'xvii', label:'XVIIe siècle',
    events:[
      { year:"~1640", title:"Premières eaux-de-vie de canne aux Caraïbes",
        text:"On commence à trouver trace, dans différentes îles des Caraïbes — à la Barbade notamment —, d'une eau-de-vie tirée de la canne à sucre, ou plus exactement de la mélasse, résidu de la fabrication du sucre." },
      { year:"1667", title:"Les écrits du Père Du Tertre",
        text:"Dans les colonies françaises, les premiers écrits faisant état d'une eau-de-vie associée à la production sucrière sont ceux du Père Du Tertre, qui fabrique un appareil de distillation pour traiter écumes et gros sirops (termes anciens désignant la mélasse)." },
      { year:"1694", title:"Le Père Labat révolutionne la distillation",
        text:"Homme d'Église, père dominicain, à la fois ethnologue, explorateur, agriculteur et bon vivant, le Père Labat retranscrit et améliore les principes d'élaboration de l'alcool de canne des Antilles françaises. Son ingéniosité permet d'améliorer la fabrication du rhum grâce à de nouvelles techniques de distillation et à l'introduction d'alambics de type charentais venus de France. Ces alambics fonctionneront jusqu'à l'invention de la colonne à distiller en continu." },
      { year:"Fin XVIIe", title:"Le terme « rhum » s'impose sur « tafia »",
        text:"Ce n'est que quelques années après les premiers écrits que le terme rhum (rum en anglais), terme originaire semble-t-il des Antilles britanniques, l'emporte sur le terme tafia jusqu'alors utilisé." },
      { year:"Fin XVIIe", title:"Le rhum, monnaie d'échange de la traite négrière",
        text:"D'abord réservé aux Noirs, aux pirates et corsaires qui naviguaient dans les Caraïbes, le rhum est aussi utilisé sur les côtes d'Afrique comme monnaie d'échange dans la traite des esclaves. À la fin du XVIIe siècle, les Français utilisent le mot « rhum » pour désigner l'alcool de canne — il ne se répandra en Europe et en Amérique du Nord qu'au cours du siècle suivant." },
      { year:"XVIIe siècle", title:"De nombreuses sucreries s'adjoignent une distillerie",
        text:"L'eau-de-vie de mélasse devient alors un sous-produit des sucreries, qui valorisent ainsi les importantes quantités de mélasses fournies par le raffinage du sucre. Les Antilles françaises deviennent le moteur du développement de la production de sucre et de rhum." }
    ]
  },
  {
    id:'xviii', label:'XVIIIe siècle',
    events:[
      { year:"1713", title:"Interdiction de vente en métropole",
        text:"Un édit royal interdit la vente de rhum hors et dans le royaume, afin de protéger les eaux-de-vie de vin. Le rhum se vend donc en contrebande." },
      { year:"1731", title:"L'Amiral Vernon invente le « grog »",
        text:"L'Amiral Vernon remplace la distribution de rum pur par un mélange de deux volumes d'eau pour un volume de rum, additionné d'un trait de jus de citron pour lutter contre le scorbut. Ce mélange est baptisé « grog », en hommage au surnom de l'Amiral, qui portait toujours une veste appelée « grogram » (gros-grain, en anglais)." },
      { year:"1765", title:"Droit à l'exportation",
        text:"Le rhum obtient le droit d'être exporté hors métropole, ouvrant la voie à sa diffusion commerciale à plus grande échelle." },
      { year:"XVIIIe siècle", title:"Diffusion en Europe et en Amérique du Nord",
        text:"En tant que boisson, le rhum ne se répand en Europe et en Amérique du Nord qu'au cours du XVIIIe siècle. L'industrie du rhum se développe alors très fortement durant les deux siècles suivants." }
    ]
  },
  {
    id:'xix', label:'XIXe siècle',
    events:[
      { year:"1803", title:"Autorisation de vente en métropole",
        text:"La vente de rhum est autorisée en métropole, avec l'institution d'une taxe d'importation de 10 francs de l'époque par hectolitre." },
      { year:"1854", title:"Suppression des droits de douane & guerre de Crimée",
        text:"Suppression des droits de douane sur les alcools coloniaux. Une épidémie d'oïdium touche la vigne la même année. La guerre de Crimée entraîne la distribution de rhum aux soldats — la Crimée, péninsule au sud de l'Ukraine bordée par la mer Noire, abrite alors une base navale russe à Sébastopol." },
      { year:"1874-1892", title:"La crise du phylloxéra",
        text:"Cette crise freine fortement les ventes d'eaux-de-vie de vin au profit du rhum et développe les exportations. Les Antilles françaises deviennent le 1er exportateur mondial de rhum." },
      { year:"2e moitié XIXe", title:"Naissance du rhum agricole autonome",
        text:"On peut situer la naissance, à la Martinique, d'une production rhumière autonome (indépendante de la sucrerie) dans la seconde moitié du XIXe siècle. C'est à cette période que la colonne à distiller, permettant une distillation en continu, remplace progressivement l'alambic." },
      { year:"Fin XIXe", title:"Chute des cours du sucre : naissance du rhum agricole",
        text:"La chute des cours mondiaux du sucre conduit à la faillite de plusieurs unités sucrières et incite de petits planteurs des Antilles françaises à se reconvertir vers la fabrication d'un nouveau rhum : le rhum agricole, eau-de-vie obtenue par distillation du pur jus de canne fermenté." }
    ]
  },
  {
    id:'xx', label:'XXe siècle',
    events:[
      { year:"1914-1918", title:"La Première Guerre mondiale relance le rhum",
        text:"Le rhum est donné aux soldats pour soutenir leur moral et leur redonner du courage, ce qui relance fortement sa production durant tout le conflit." },
      { year:"1918", title:"Reprise et grave récession",
        text:"La reprise des productions en France, après-guerre, entraîne une grave récession du marché du rhum." },
      { year:"1922", title:"Mise en place des contingents",
        text:"Des contingents sont instaurés afin de stabiliser la production et les prix du rhum, fortement déséquilibrés depuis la fin de la guerre." },
      { year:"1996", title:"L'AOC Martinique",
        text:"Décret du 5 novembre 1996 (NOR : FCEC9600198D) : le rhum agricole de la Martinique obtient l'appellation d'origine contrôlée « Martinique ». Toutes les étapes de fabrication sont codifiées : sélection des variétés de canne autorisées, rhums blancs travaillés au minimum 3 mois, rhums paille en foudre de chêne contrôlé, rhums vieux vieillis au moins 3 ans sur le lieu de production en fûts de chêne de moins de 650 litres. La Martinique reste aujourd'hui le seul DOM à bénéficier d'une AOC réservant son nom au rhum agricole produit dans le respect des usages locaux." }
    ]
  }
];

let currentEra = 0;

const tabsEl = document.getElementById('eraTabs');
const gridEl = document.getElementById('cardsGrid');
const overlay = document.getElementById('overlay');
const detailBadge = document.getElementById('detailBadge');
const detailTitle = document.getElementById('detailTitle');
const detailText = document.getElementById('detailText');
const closeBtn = document.getElementById('closeBtn');

eras.forEach((era, i) => {
  const btn = document.createElement('button');
  btn.className = 'era-btn';
  btn.textContent = era.label;
  btn.addEventListener('click', () => { currentEra = i; renderEra(); });
  tabsEl.appendChild(btn);
});

function renderEra(){
  [...tabsEl.children].forEach((b,i) => b.classList.toggle('active', i === currentEra));
  const era = eras[currentEra];
  gridEl.innerHTML = '';
  era.events.forEach(ev => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <span class="badge">${ev.year}</span>
      <div class="card-title">${ev.title}</div>
      <div class="card-hint">Voir le détail →</div>
    `;
    card.addEventListener('click', () => openDetail(ev));
    gridEl.appendChild(card);
  });
  gridEl.parentElement.scrollTop = 0;
}

function openDetail(ev){
  detailBadge.textContent = ev.year;
  detailTitle.textContent = ev.title;
  detailText.textContent = ev.text;
  overlay.classList.add('visible');
  document.getElementById('detailPanel').scrollTop = 0;
}
function closeDetail(){ overlay.classList.remove('visible'); }

closeBtn.addEventListener('click', closeDetail);
overlay.addEventListener('click', (e) => { if(e.target === overlay) closeDetail(); });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeDetail(); });

renderEra();
</script>

</html>
